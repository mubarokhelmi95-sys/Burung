name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install library sistem untuk Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0

      - name: Install dependency
        run: npm install

      - name: Render
        run: npx remotion render src/index.tsx Bird out/bird.mp4 --gl=swangle

      - uses: actions/upload-artifact@v4
        with:
          name: bird-video
          path: out/bird.mp4
